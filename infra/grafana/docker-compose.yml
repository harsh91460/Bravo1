services:
mongodb:
image: mongo:8
container_name: bravo-mongodb
restart: unless-stopped
environment:
MONGO_INITDB_DATABASE: bravo
ports:
- "127.0.0.1:27017:27017"
volumes:
- mongo_data:/data/db
healthcheck:
test:
[
"CMD",
"mongosh",
"--quiet",
"--eval",
"db.adminCommand('ping').ok"
]
interval: 10s
timeout: 5s
retries: 5

redis:
image: redis:8-alpine
container_name: bravo-redis
restart: unless-stopped
command: ["redis-server", "--appendonly", "yes"]
ports:
- "127.0.0.1:6379:6379"
volumes:
- redis_data:/data
healthcheck:
test: ["CMD", "redis-cli", "ping"]
interval: 10s
timeout: 5s
retries: 5

volumes:
mongo_data:
redis_data:
